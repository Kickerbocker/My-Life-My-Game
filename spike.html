<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Health test</title>
<!-- Milestone 1 spike: can this page read Google Health straight from the phone? Not part of the game. -->
<style>
  :root { --bg: #17130f; --card: #241e18; --text: #efe4d6; --muted: #b8a893; --accent: #d98c4a; --ok: #9fbf6a; --bad: #e07a5f; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 6px 0 14px; }
  button { display: block; width: 100%; min-height: 48px; margin: 10px 0; border: 0; border-radius: 12px;
           background: var(--accent); color: #1a120b; font: 600 17px -apple-system, system-ui, sans-serif; }
  button.alt { background: var(--card); color: var(--text); border: 1px solid #4a3d31; }
  .row { background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .row b { display: block; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--muted); margin: 6px 0 0; max-height: 220px; overflow: auto; }
</style>
</head>
<body>
<main>
  <h1>Google Health test</h1>
  <p>Tap Connect, sign in with the account your Google Health app uses, and allow access. Then tap Copy results and paste them to Claude.</p>
  <button id="connect">Connect Google Health</button>
  <button id="redirect" class="alt">Connect (redirect version)</button>
  <div id="status"></div>
  <div id="out"></div>
  <button id="copy" class="alt" hidden>Copy results</button>
</main>
<script>
const CLIENT_ID = '444940066790-rq6guq0iigqcvu5ep8j95tcvbglm4s6b.apps.googleusercontent.com';
const P = 'https://www.googleapis.com/auth/googlehealth';
// Only health scopes: mixing in sign-in scopes (openid, email) is reported to make the API refuse the token.
const SCOPES = [P + '.sleep.readonly', P + '.nutrition.readonly', P + '.health_metrics_and_measurements.readonly'].join(' ');
const BASE = 'https://health.googleapis.com/v4/users/me/dataTypes/';
// Sleep and nutrition names are documented; the heart ones are guesses, so several are tried.
const TYPES = ['sleep', 'nutrition-log', 'daily-resting-heart-rate', 'resting-heart-rate',
               'daily-heart-rate-variability', 'heart-rate-variability'];
const $ = (id) => document.getElementById(id);
const report = [];

function say(msg, cls) { $('status').innerHTML = '<div class="row ' + (cls || '') + '">' + msg + '</div>'; }

async function run(token, how) {
  report.length = 0;
  report.push('Sign-in: ' + how + ' | in home-screen app: ' + (navigator.standalone === true) + ' | ' + navigator.userAgent);
  say('Signed in. Reading data…');
  $('out').innerHTML = '';
  for (const t of TYPES) {
    let line;
    try {
      const r = await fetch(BASE + t + '/dataPoints?pageSize=3', { headers: { Authorization: 'Bearer ' + token } });
      const body = await r.text();
      line = { t, ok: r.ok, head: r.status, body: body.slice(0, 1500) };
    } catch (e) {
      // A TypeError here usually means the browser blocked the call (no CORS), which is the key thing to learn.
      line = { t, ok: false, head: 'blocked: ' + e, body: '' };
    }
    report.push('== ' + line.t + ' -> ' + line.head + '\n' + line.body);
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = '<b class="' + (line.ok ? 'ok' : 'bad') + '">' + line.t + ': ' + line.head + '</b>';
    const pre = document.createElement('pre');
    pre.textContent = line.body;
    div.appendChild(pre);
    $('out').appendChild(div);
  }
  say('Done. Tap Copy results and paste them to Claude.', 'ok');
  $('copy').hidden = false;
}

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(report.join('\n\n')); say('Copied. Paste it to Claude.', 'ok'); }
  catch (e) { say('Copy failed: ' + e + '. Take screenshots instead.', 'bad'); }
};

// Popup sign-in through Google Identity Services.
$('connect').onclick = () => {
  if (!window.google || !google.accounts) { say('Google sign-in script did not load.', 'bad'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) { say('Sign-in error: ' + resp.error + ' ' + (resp.error_description || ''), 'bad'); report.push('Sign-in error: ' + JSON.stringify(resp)); $('copy').hidden = false; return; }
      run(resp.access_token, 'popup');
    },
    error_callback: (err) => { say('Popup problem: ' + (err && err.type), 'bad'); report.push('Popup problem: ' + JSON.stringify(err)); $('copy').hidden = false; },
  });
  client.requestAccessToken();
};

// Full-page redirect sign-in. Needs this page's address added under "Authorized redirect URIs".
const HERE = location.origin + location.pathname;
$('redirect').onclick = () => {
  const q = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: HERE, response_type: 'token', scope: SCOPES, include_granted_scopes: 'false' });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q;
};
const back = new URLSearchParams(location.hash.slice(1));
if (back.get('access_token')) { history.replaceState(null, '', HERE); run(back.get('access_token'), 'redirect'); }
else if (back.get('error')) { say('Sign-in error: ' + back.get('error'), 'bad'); }
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
